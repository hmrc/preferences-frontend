include "frontend.conf"

appName = "preferences-frontend"

# Default http client
play.modules.enabled += "uk.gov.hmrc.play.bootstrap.HttpClientV2Module"

play.modules.enabled += "uk.gov.hmrc.play.bootstrap.AuthModule"

session.timeoutSeconds = 900
session.countdownSeconds = 60

# Custom error handler
play.http.errorHandler = "config.ErrorHandler"

api.version = ${?APP_VERSION}   #Set via env var, injected automatically on k8s

# Play Modules
# ~~~~
# Additional play modules can be added here

play.filters.enabled += play.filters.csp.CSPFilter
play.modules.enabled += "config.PreferencesFrontendModule"

#Following is the secret key being used to encrypt entityId in preferences-front-end and decrypt it in channel-preferences service.
#So, if we attmept to change the key here, same has to be updated in channel-preferences.
entityId.encryption.key = "gvBoGdgzqG1AarzF1LY0zQ=="

queryParams.encryption.secondary.key = "gvBoGdgzqG1AarzF1LY0zQ=="

# Secret key
# ~~~~~
# The secret key is used to secure cryptographics functions.
# If you deploy your application to several instances be sure to use the same key!
# Not set here so that MDTP frontends share the same secret key in the local environment
# (see common.conf in frontend-bootstrap).
# In server environments the secret comes from app-config-common
# play.http.secret.key="boWTRoEElGJGRLQWG48FEhiAtdPrs8BAHF4CTStUmMb9A67qZYtLBGg2axBkYRU9"

google-analytics {
  token = N/A
  host = auto
}

play.i18n.langs = ["en", "cy"]

features.languageTranslationEnabled = true

#copy from legacy

abTesting.cohort.IPage7.enabled = true
abTesting.cohort.IPage8.enabled = true
abTesting.cohort.TCPage9.enabled = true
abTesting.cohort.ReOptInPage10.enabled = true
abTesting.cohort.ReOptInPage52.enabled = true
abTesting.cohort.ReOptInPage54.enabled = true
abTesting.cohort.ReOptInPage55.enabled = true
abTesting.cohort.IPage53.enabled = true
abTesting.cohort.IPage56.enabled = true

play.filters.csrf.contentType.whiteList.0 = "application/json"


play.allowGlobalApplication = true

include "sa_prefs.conf"

platform.frontend.host = "http://localhost:9250"
bas-gateway-frontend.host = "http://localhost:9553"

CPFUrl = "http://localhost:9053"

microservice {
metrics {
    graphite {
      enabled = true
    }
  }

  services {
    timeout = 5 seconds

    delay-response = 2 seconds

    protocol = http

    auth {
      host = localhost
      port = 8500
    }

    entity-resolver {
      host=localhost
      port=8015
      circuitBreaker {
        numberOfCallsToTriggerStateChange = 50
        unavailablePeriodDurationInSeconds = 120
        unstablePeriodDurationInSeconds = 120
      }
    }



    preferences {
      host=localhost
      port=8025
      circuitBreaker {
        numberOfCallsToTriggerStateChange = 50
        unavailablePeriodDurationInSeconds = 30
        unstablePeriodDurationInSeconds = 30
      }
    }

    email {
      host=localhost
      port=8300
      circuitBreaker {
        numberOfCallsToTriggerStateChange = 5
        unavailablePeriodDurationInSeconds = 120
        unstablePeriodDurationInSeconds = 120
      }
    }

    hmrc-deskpro {
      host=localhost
      port=8650
    }
  }
}

#Assets configuration
play.http.router = prod.Routes
#play.http.router = testOnlyDoNotUseInAppConf.Routes

play.assets {
  # The path on the classpath where assets are located (should be the same as the path parameter in route)
  path = "/public"
  # The URL prefix before your asset name (excluding the trailing slash)
  urlPrefix = "/paperless/assets"
}

languageSwitcher.fallback.url = "#"

sca-wrapper {
    host = "http://localhost:9024"
    signin.url = "/paperless/timeout"
    feedback-service-name = "preferences-frontend"
    exit-survey-origin = "SCA-FE"
    accessibility-statement {
      referrer.url = "/paperless/optin"
      redirect.url = "paperless"
    }
    service-name {
      messages-key = service.name
    }
    welsh-enabled = true
    disable-session-expired = false
    banners {
        show-alpha = false
        show-beta = false
        show-help-improve = false
        show-child-benefit = false
    }
}

play-frontend-hmrc.useRebrand = true
play-frontend-hmrc.forceServiceNavigation = true